<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Wordcraft…</title>
  <meta name="description" content="Wordcraft — 100 days of practical English vocabulary and lessons.">
  <link rel="icon" href="./dist/favicon.svg" type="image/svg+xml">
  <meta http-equiv="refresh" content="0; url=./dist/">
  <script>
    const destination = new URL('./dist/', window.location.href);
    destination.search = window.location.search;
    const day = window.location.hash.match(/^#day-(\d+)$/);
    const category = window.location.hash.match(/^#category-(.+)$/);
    if (day) destination.searchParams.set('day', day[1]);
    else if (window.location.hash === '#categories') destination.searchParams.set('page', 'categories');
    else if (category) destination.searchParams.set('category', category[1]);
    destination.hash = '';
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>Opening <a href="./dist/">Wordcraft</a>…</p>
</body>
</html>
